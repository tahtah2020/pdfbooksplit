name: story-tts
on:
  push:
    branches: [story-tts]
    paths-ignore: ["out/**"]
permissions:
  contents: write
jobs:
  speak:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HOME: ${{ github.workspace }}/hf-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install (CPU)
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts huggingface_hub safetensors "setuptools<81"
      - name: Speak
        run: |
          s=$(date +%s)
          python tts.py --batch lines.json out --exaggeration 0.55
          echo "::notice::generated in $(( $(date +%s) - s ))s"
      - name: Commit audio
        run: |
          git config user.name "story-tts-bot"
          git config user.email "story-tts-bot@users.noreply.github.com"
          git add out
          git commit -m "Add narration audio"
          git push
